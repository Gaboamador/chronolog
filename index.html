<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />

    <link rel="icon" href="/chronolog/favicon.ico" />
    <link rel="apple-touch-icon" href="/chronolog/isotipo_circular_192.png" />
    <link rel="manifest" href="/chronolog/manifest.json" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <script>
      try {
        const savedTheme = localStorage.getItem('chronolog:theme-preference');
        const preferredTheme = ['light', 'dark', 'system'].includes(savedTheme) ? savedTheme : 'dark';
        const theme = preferredTheme === 'system'
          ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
          : preferredTheme;
        document.documentElement.dataset.theme = theme;
      } catch {
        document.documentElement.dataset.theme = 'dark';
      }
    </script>
    <meta
      name="description"
      content="Chronolog"
    />

    <title>Chronolog</title>
    <script type="module" crossorigin src="/chronolog/assets/index-OZdsI8C9.js"></script>
    <link rel="stylesheet" crossorigin href="/chronolog/assets/index-BZb9tcQP.css">
  </head>

  <body>
    <noscript>Necesitás habilitar JavaScript para usar esta app.</noscript>
    <div id="root"></div>
  </body>
</html>
